# Configuração Global do NGINX.

worker_processes auto;

# Arquitetura PID em diretório gravável pelo usuário não-root.
pid /tmp/nginx.pid;

# Logs enviados para stdout/stderr do container.
error_log /dev/stderr warn;

# Configuração de Eventos.
events {
    worker_connections 1024;
}

# Configuração HTTP.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs direcionados para o ambiente dos containers.
    access_log /dev/stdout;

    # Não expõe a versão do Nginx.
    server_tokens off;

    # Otimização para servir os arquivos estáticos.
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    # Diretórios temporários graváveis pelo usuário não-root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Resolução dinâmica dos serviços na rede Docker.
    resolver 127.0.0.11 valid=5s ipv6=off;

    #Backend Node.js
    upstream api_backend {
        zone api_backend 64k;
        server api:3000 resolve;
        keepalive 16;
    }

    # Servidor Frontend Kubeshop.
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cabeçalhos de Segurança.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        add_header Content-Security-Policy
            "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            always;

        # Health Check Do Nginx.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Proxy Reverso para a Api.
        location /api/ {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Trata também a rota /api sem barra final.
        location = /api {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Aplicação React - Single Page Application.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache dos arquivos estáticos.
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}