# ==========================================================
# KubeShop - MODELO de inventário do Ansible
#
# Não edite este arquivo com os IPs reais. Gere o inventário
# a partir do Terraform (o resultado é ignorado pelo Git):
#
#   terraform -chdir=../terraform output -raw ansible_inventory > inventory.local.ini
#
# O formato gerado é o mesmo deste modelo.
# ==========================================================

[app]
kubeshop-app ansible_host=IP_PUBLICO_DA_APP private_ip=10.20.1.10

[db]
kubeshop-db ansible_host=10.20.2.10 private_ip=10.20.2.10

# A VM do banco não tem IP público: o acesso passa pela VM da aplicação.
[db:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -W %h:%p -q ubuntu@IP_PUBLICO_DA_APP"'

[all:vars]
ansible_user=ubuntu
