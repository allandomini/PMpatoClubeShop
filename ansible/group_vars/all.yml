# ==========================================================
# KubeShop - Variáveis comuns a todas as VMs
#
# SEGREDOS: nunca ficam neste arquivo. São lidos de variáveis de
# ambiente de quem executa (máquina local ou segredos do pipeline):
#
#   KUBESHOP_MONGO_ROOT_PASSWORD   senha do administrador do MongoDB
#   KUBESHOP_MONGO_APP_PASSWORD    senha do usuário da API
#   KUBESHOP_BACKUP_SAS_URL        terraform output -raw backup_sas_url
#
# As tarefas que usam esses valores têm "no_log: true".
# ==========================================================

kubeshop_timezone: America/Sao_Paulo

# Versão implantada: commit atual do repositório de quem executa.
kubeshop_version: "{{ lookup('ansible.builtin.pipe', 'git rev-parse --short HEAD') }}"

# Banco de dados
mongo_image: mongo:8.2.12-noble
mongo_port: 27017
mongo_database: kubeshop
mongo_root_username: admin
mongo_app_username: kubeshop

mongo_root_password: "{{ lookup('ansible.builtin.env', 'KUBESHOP_MONGO_ROOT_PASSWORD') }}"
mongo_app_password: "{{ lookup('ansible.builtin.env', 'KUBESHOP_MONGO_APP_PASSWORD') }}"
backup_sas_url: "{{ lookup('ansible.builtin.env', 'KUBESHOP_BACKUP_SAS_URL') }}"

# Endereços privados (vêm do inventário gerado pelo Terraform).
app_private_ip: "{{ hostvars[groups['app'][0]].private_ip }}"
db_private_ip: "{{ hostvars[groups['db'][0]].private_ip }}"
