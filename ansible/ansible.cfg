# ==========================================================
# KubeShop - Configuração do Ansible
#
# Rode os comandos a partir da pasta ansible/:
#   cd ansible
#   ansible-playbook site.yml
# ==========================================================

[defaults]
# Inventário gerado pelo Terraform (ignorado pelo Git):
#   terraform -chdir=../terraform output -raw ansible_inventory > inventory.local.ini
# O arquivo inventory.ini versionado é apenas o modelo.
inventory = inventory.local.ini
roles_path = roles
remote_user = ubuntu
interpreter_python = auto_silent
forks = 10
timeout = 30

# Saída legível e com duração das tarefas (evidência das execuções).
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = ansible.builtin.profile_tasks

# Nunca grava arquivos .retry no repositório.
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
# Aceita a chave de VMs recém-criadas, mas recusa se ela mudar depois.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
